name: app_matrimony
description: "Matrimony"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^7.6.0
  shared_preferences: ^2.1.2
  flutter_screenutil: ^5.8.3
  http: ^1.0.0
  get: ^4.6.5
  provider: ^6.0.5
  dartz: ^0.10.1
  intl: ^0.18.1
  getwidget: ^3.1.1
  responsive_sizer: ^3.1.0
  overlay_support: ^2.0.1
  connectivity_plus: ^6.1.0
  device_info_plus: ^9.0.2
  package_info_plus: ^4.0.2
  flutter_spinkit: ^5.2.0
  webview_flutter: ^4.4.4
  fluttertoast: ^8.2.2
  permission_handler: ^11.3.1
  lottie: ^3.2.0
  flutter_svg: ^2.0.10
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path: ^1.9.0
  encrypt: ^5.0.1
  crypto: ^3.0.3
  in_app_update: ^4.2.3
  url_launcher: ^6.2.4
  sms_autofill: ^2.3.0
  graphic: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/matri_match.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/matri_match.png"
    background_color: "#FFFFFF"
    theme_color: "#D6376E"


